{%- if cookiecutter.with_conventional_commits|int %}
name: PR

on:
  pull_request:
    types: [edited, opened, reopened, synchronize]

# Keyed on head_ref, not github.ref: on a pull_request event github.ref is
# refs/pull/<n>/merge rather than the branch, so the push and pull_request
# runs of one commit land in separate groups and neither supersedes the
# other. github.ref stays as the fallback for push, schedule and
# workflow_dispatch, where head_ref is empty.
concurrency:
  group: {% raw %}${{{% endraw %} github.workflow }}-{% raw %}${{{% endraw %} github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    name: Check PR title
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "{{ cookiecutter.python_version }}"

      - name: Check PR title
        # The title reaches the shell through the environment, not through
        # {% raw %}${{ }}{% endraw %} interpolation: a pull request title is
        # attacker-controlled text, and interpolating it directly builds the
        # command out of it, so a title carrying shell metacharacters would
        # execute on the runner. Same fix the terraform-plan-and-apply action
        # in this template already documents.
        env:
          PR_TITLE: {% raw %}${{ github.event.pull_request.title }}{% endraw %}
        run: |
          pip install commitizen
          cz check --message "$PR_TITLE"
{%- endif %}
