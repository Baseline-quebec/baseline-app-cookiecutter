name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
  workflow_dispatch:

# Keyed on head_ref, not github.ref: on a pull_request event github.ref is
# refs/pull/<n>/merge rather than the branch, so the push and pull_request
# runs of one commit land in separate groups and neither supersedes the
# other. github.ref stays as the fallback for push, schedule and
# workflow_dispatch, where head_ref is empty.
concurrency:
  group: {% raw %}${{{% endraw %} github.workflow }}-{% raw %}${{{% endraw %} github.head_ref || github.ref }}
  cancel-in-progress: {% raw %}${{{% endraw %} github.ref != 'refs/heads/main' }}

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["{{ cookiecutter.python_version }}"{% if cookiecutter.python_version != "3.13" %}, "3.13"{% endif %}]

    name: Python {% raw %}${{{% endraw %} matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install @devcontainers/cli
        # Pinned rather than @latest: an unpinned CLI means the version that
        # builds the devcontainer changes under the project without a commit, so
        # a green pipeline can turn red on someone else's release.
        #
        # Pinned to a *current* version on purpose. An earlier revision pinned
        # 0.58.0 because that is what the two existing Baseline projects run —
        # but 0.58.0 is from 2024-03-22 and 0.89.0 from 2026-08-31, so matching
        # them would freeze every project generated from here on ~2.5 years and
        # 31 minor versions of drift. Determinism comes from pinning at all; the
        # choice of version is a separate decision. Neither release has a known
        # advisory (`npm audit`: 0 vulnerabilities on both), so this is a
        # maintenance call, not a security one.
        #
        # Nothing watches this pin automatically: Dependabot's github-actions
        # ecosystem only tracks `uses:` references, not an npm package installed
        # inside a `run:`. So it will not move on its own — bump it here when the
        # template is touched, and every generated project follows.
        run: npm install --location=global @devcontainers/cli@0.89.0

      # A "Cache Docker layers" step used to sit here, caching /tmp/.buildx-cache
      # with BUILDKIT_INLINE_CACHE=1 on the build below. It never cached
      # anything, for two independent reasons:
      #
      #   - The inline cache exporter embeds cache metadata into the *pushed
      #     image's* config; by design it writes nothing to a local directory.
      #     Filling /tmp/.buildx-cache needs `--cache-to type=local,dest=...`,
      #     which `devcontainer up` does not pass.
      #   - The devcontainer image is never pushed anywhere, so an exporter that
      #     works through the pushed image has no target either way.
      #
      # So actions/cache did a restore and a save of an empty directory on every
      # run. Removed rather than left as decoration.
      #
      # Making it real means having buildx build the devcontainer image (or
      # publishing it to a registry and pulling by a content-addressed tag, which
      # is what the downstream monorepo does — 18 min down to ~20s). That is a
      # larger change than this template should carry by default.

      # mypy runs strict over src/** and tests/** in `poe lint`, and rebuilds its
      # cache from nothing every run because .mypy_cache is gitignored and
      # nothing persists it. Measured on a downstream project running mypy strict
      # with the pydantic plugin over 505 files: 171s cold, 14s warm, and still
      # ~9s after a real source edit. That project uses Poetry rather than uv, so
      # the numbers show the order of magnitude, not a like-for-like run of this
      # template.
      #
      # The key deliberately does NOT hash the source. mypy's incremental mode
      # already reanalyses only what changed and its dependents — which is why a
      # source edit costs 9s and not 171s — so hashing source would miss on
      # every commit and buy nothing. What invalidates the whole cache is the
      # dependency set and the mypy version, hence uv.lock plus pyproject.toml,
      # which carries [tool.mypy]. restore-keys lets a lockfile bump start from
      # the previous cache and revalidate rather than restart cold.
      #
      # python-version is in the key because mypy stores its cache per
      # interpreter version, and this job is a matrix over more than one.
      #
      # WHAT TO WATCH. actions/cache never replaces an entry — a new key writes a
      # new one — and this key changes on every lockfile bump, with restore-keys
      # making each new entry start full. On the downstream project .mypy_cache
      # measured 506 MB, so at one entry per bump per Python version the 10 GB
      # per-repository cache budget is reachable within roughly ten bumps. Past
      # that GitHub evicts by least-recent-use, and it evicts across the whole
      # repository, so this cache can push out entries other workflows depend on.
      # Check `gh api repos/{owner}/{repo}/actions/cache/usage` if builds start
      # missing caches they used to hit; the remedy is deleting stale mypy
      # entries, not raising the budget, which is fixed.
      #
      # Also note uv.lock does not exist on the first run of a freshly generated
      # project: the Dockerfile copies it with an optional glob and `uv sync`
      # writes it inside the container, which happens in `Start Dev Container`
      # below — after this step. hashFiles tolerates the missing file, so the key
      # is stable, but on that first run it hashes pyproject.toml alone and then
      # changes once uv.lock is committed, leaving one orphaned entry behind.
      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: {% raw %}${{{% endraw %} runner.os }}-mypy-{% raw %}${{{% endraw %} matrix.python-version }}-{% raw %}${{{% endraw %} hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            {% raw %}${{{% endraw %} runner.os }}-mypy-{% raw %}${{{% endraw %} matrix.python-version }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Dev Container
        run: |
          git config --global init.defaultBranch main
          PYTHON_VERSION={% raw %}${{{% endraw %} matrix.python-version }} devcontainer up --workspace-folder .

      - name: Lint {{ cookiecutter.project_type }}
        run: devcontainer exec --workspace-folder . poe lint

      - name: Test {{ cookiecutter.project_type }}
        run: devcontainer exec --workspace-folder . poe test

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          path: reports/htmlcov/
          name: coverage-report-{% raw %}${{{% endraw %} matrix.python-version }}
          retention-days: 7
