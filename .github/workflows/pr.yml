name: PR

on:
  pull_request:
    types: [edited, opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: Check PR title
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check PR title
        # The title reaches the shell through the environment, not through
        # ${{ }} interpolation: a pull request title is attacker-controlled text,
        # and interpolating it directly builds the command from it, so a title
        # containing shell metacharacters would execute on the runner. Same fix
        # the generated terraform-plan-and-apply action already documents.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pip install commitizen
          cz check --message "$PR_TITLE"
