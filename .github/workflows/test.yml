name: Integration

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        include:
          - python-version: "3.12"
            variant: full
            answers: >-
              -d project_name="My Project" -d python_version=3.12
              -d with_fastapi_api=true -d with_typer_cli=true -d with_sentry=false
          - python-version: "3.13"
            variant: minimal
            answers: >-
              -d project_name="My Project" -d python_version=3.13
              -d with_fastapi_api=false -d with_typer_cli=false -d with_sentry=false

    name: Python ${{ matrix.python-version }} — ${{ matrix.variant }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: repo

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Scaffold Python project
        # `--vcs-ref=HEAD` renders the checked-out revision: without it, Copier
        # resolves a local git template to its newest tag.
        run: |
          uvx copier copy --defaults --vcs-ref=HEAD \
            ${{ matrix.answers }} ./repo/ ./my-project/

      - name: Verify Copier answers file
        run: |
          test -f .copier-answers.yml
          grep -q '^_commit:' .copier-answers.yml
          grep -q '^_src_path:' .copier-answers.yml
        working-directory: ./my-project/

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install @devcontainers/cli
        run: npm install --location=global @devcontainers/cli@0.88.0

      - name: Start Dev Container with Python ${{ matrix.python-version }}
        run: |
          git config --global init.defaultBranch main
          git init
          git checkout -b test
          git add .
          PYTHON_VERSION=${{ matrix.python-version }} devcontainer up --workspace-folder .
        working-directory: ./my-project/

      - name: Lint project
        run: devcontainer exec --workspace-folder my-project poe lint

      - name: Test project
        run: devcontainer exec --workspace-folder my-project poe test
