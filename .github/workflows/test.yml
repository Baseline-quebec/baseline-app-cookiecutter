name: Integration

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    # This job generates a project and builds its devcontainer, so it is the
    # slow one here — measured at ~4 min against ~35s for the others.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        include:
          - python-version: "3.12"
            variant: full
            extra-context: '{"project_type": "app", "project_name": "My Project", "python_version": "3.12", "with_fastapi_api": "1", "with_typer_cli": "1", "with_sentry": "0"}'
          - python-version: "3.13"
            variant: minimal
            extra-context: '{"project_type": "app", "project_name": "My Project", "python_version": "3.13", "with_fastapi_api": "0", "with_typer_cli": "0", "with_sentry": "0"}'

    name: Python ${{ matrix.python-version }} — ${{ matrix.variant }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: template

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Scaffold Python project
        run: |
          pip install --no-input cruft
          cruft create --no-input --extra-context '${{ matrix.extra-context }}' ./template/

      - name: Verify cruft link
        run: cruft check
        working-directory: ./my-project/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install @devcontainers/cli
        # Pinned for the same reason as the generated workflow: an unpinned CLI
        # changes under this repo without a commit. Keep the two in sync.
        run: npm install --location=global @devcontainers/cli@0.89.0

      - name: Start Dev Container with Python ${{ matrix.python-version }}
        run: |
          git config --global init.defaultBranch main
          git init
          git checkout -b test
          git add .
          PYTHON_VERSION=${{ matrix.python-version }} devcontainer up --workspace-folder .
        working-directory: ./my-project/

      - name: Lint project
        run: devcontainer exec --workspace-folder my-project poe lint

      - name: Test project
        run: devcontainer exec --workspace-folder my-project poe test
