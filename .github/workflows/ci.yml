name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keyed on head_ref rather than github.ref, which on a pull_request event is
# refs/pull/<n>/merge rather than the branch — the push and pull_request runs of
# one commit would otherwise sit in separate groups and never supersede each
# other. github.ref is the fallback for push, where head_ref is empty.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    name: Unit tests — Python ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install cookiecutter pytest pyyaml

      - name: Run tests
        run: pytest tests/ -v
