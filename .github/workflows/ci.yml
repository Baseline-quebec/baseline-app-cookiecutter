name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    name: Unit tests — Python ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # This repository has no dependency manifest, so the test dependencies
      # are named here rather than resolved from a lock file.
      - name: Run tests
        run: uv run --with copier --with pytest --with pyyaml pytest tests/ -v
