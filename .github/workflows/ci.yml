name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    name: Unit tests — Python ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      # No `cache: pip`: this repository has no dependency manifest for
      # setup-python to key a cache on.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install copier pytest pyyaml

      - name: Run tests
        run: pytest tests/ -v
